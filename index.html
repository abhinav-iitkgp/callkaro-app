    <script>
      (function () {
        var nav = window.navigator;
        var ua = nav.userAgent || '';
        var standalone =
          nav.standalone === true ||
          (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
        var isIOS = /iPhone|iPad|iPod/.test(ua) || (nav.platform === 'MacIntel' && nav.maxTouchPoints > 1);
        var inAppBrowser = /FBAN|FBAV|Instagram|Line\/|LinkedInApp|Snapchat|Twitter/i.test(ua);

        function store(k, v) {
          try {
            if (v === undefined) return window.localStorage.getItem(k);
            window.localStorage.setItem(k, v);
          } catch (e) {}
          return null;
        }

        var toastEl = document.getElementById('ck-toast');
        function toast(msg, ms) {
          toastEl.textContent = msg;
          toastEl.hidden = false;
          toastEl.style.opacity = '1';
          setTimeout(function () {
            toastEl.style.opacity = '0';
            setTimeout(function () { toastEl.hidden = true; }, 400);
          }, ms || 3200);
        }

        /* ---------- offline support ---------- */
        var offlineReady = false;
        if ('serviceWorker' in nav) {
          var hadController = !!nav.serviceWorker.controller;
          var pendingReload = false;
          nav.serviceWorker.addEventListener('controllerchange', function () {
            if (!hadController) { hadController = true; return; }
            // A newer version finished downloading: switch to it the next time the app is brought forward.
            pendingReload = true;
            if (document.visibilityState === 'hidden') window.location.reload();
          });
          document.addEventListener('visibilitychange', function () {
            if (document.visibilityState !== 'visible') return;
            if (pendingReload) { window.location.reload(); return; }
            nav.serviceWorker.getRegistration().then(function (r) {
              if (r) r.update().catch(function () {});
            });
          });
          nav.serviceWorker.addEventListener('message', function (e) {
            var d = e.data || {};
            if (d.type !== 'status' || offlineReady) return;
            if (d.cached >= d.total) {
              offlineReady = true;
              document.documentElement.setAttribute('data-offline-ready', '1');
              if (!store('ck_offline_ready')) {
                store('ck_offline_ready', '1');
                toast('Saved on this phone. Works without internet.');
              }
            }
          });
          window.addEventListener('load', function () {
            nav.serviceWorker
              .register('sw.js')
              .then(function () { return nav.serviceWorker.ready; })
              .then(function (reg) {
                var tries = 0;
                (function ask() {
                  if (offlineReady || tries++ > 40) return;
                  if (reg.active) reg.active.postMessage({ type: 'status' });
                  setTimeout(ask, 2500);
                })();
              })
              .catch(function () {});
          });
        }

        /* ---------- install hint (only in a browser tab, never inside the installed app) ---------- */
        var box = document.getElementById('ck-install');
        var steps = document.getElementById('ck-steps');
        var actions = document.getElementById('ck-actions');
        var shareIcon =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
        function hide(remember) {
          box.hidden = true;
          if (remember) store('ck_install_dismissed', String(Date.now()));
        }
        document.getElementById('ck-x').addEventListener('click', function () { hide(true); });
        function recentlyDismissed() {
          var t = parseInt(store('ck_install_dismissed') || '0', 10);
          return t && Date.now() - t < 3 * 24 * 3600 * 1000;
        }

        if (!standalone && !recentlyDismissed()) {
          if (isIOS) {
            steps.innerHTML = inAppBrowser
              ? 'Open this page in <b>Safari</b> first, then tap <b>Share</b> ' + shareIcon + ' and choose <b>Add to Home Screen</b>.'
              : 'Tap <b>Share</b> ' + shareIcon + ' (in Safari it can be under <b>&bull;&bull;&bull;</b>), then <b>Add to Home Screen</b>. It then opens full screen and works offline.';
            setTimeout(function () { box.hidden = false; }, 1200);
          } else {
            window.addEventListener('beforeinstallprompt', function (e) {
              e.preventDefault();
              steps.textContent = 'Add it to your home screen. It opens full screen and works offline.';
              actions.innerHTML = '';
              var b = document.createElement('button');
              b.textContent = 'Install';
              b.addEventListener('click', function () {
                hide(false);
                e.prompt();
              });
              actions.appendChild(b);
              box.hidden = false;
            });
          }
        }
        window.addEventListener('appinstalled', function () { hide(true); });
      })();
